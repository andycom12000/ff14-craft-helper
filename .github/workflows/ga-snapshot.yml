name: GA daily snapshot

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC = 12:00 Asia/Taipei
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ga-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Write SA cred
        env:
          GA_SA_JSON: ${{ secrets.GA_SA_JSON }}
        run: |
          mkdir -p $HOME/.ff14-craft-helper
          printf '%s' "$GA_SA_JSON" > $HOME/.ff14-craft-helper/ga-sa.json

      - name: Prepare gh-data working tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin gh-data || true
          if git rev-parse --verify origin/gh-data >/dev/null 2>&1; then
            # Existing branch: worktree shares main repo's .git so it inherits
            # actions/checkout's injected auth header for github.com.
            git worktree add -B gh-data /tmp/gh-data origin/gh-data
          else
            # Orphan bootstrap: standalone repo with no inherited auth.
            # Embed the token in the remote URL so git push can authenticate.
            mkdir /tmp/gh-data
            cd /tmp/gh-data
            git init -b gh-data
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
            cd -
          fi

      - name: Run snapshot
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: |
          node scripts/dev/ga-analyze.mjs --snapshot \
            --out /tmp/gh-data/snapshot.json \
            --history /tmp/gh-data/history

      # #205 AC 第一條：趨勢檔要真的被產生，不能只是腳本存在從沒被呼叫。獨立腳本、獨立步驟——
      # 不動 `ga-analyze.mjs`（#209 同時在重寫它）。刻意不帶 `--window`：預設保留整份
      # history/ 封存（不是只留最近 28 天），理由見 ga-build-trend.mjs 開頭 — #191 決定 5
      # 的容量估算（≈73 KB/年）本來就是抓不截斷的成長曲線，且年資標記（決定 2 第三級）需要
      # 完整歷史長度才能正確判斷 streakCensored。`continue-on-error: true`：這是衍生產物，
      # 算失敗也不該擋下 snapshot.json/history/ 的 commit + push（那才是每日 cron 的核心
      # payload），只是那天 trends.json 沒更新，#206/#207 讀到的會是前一天的版本，不是壞掉
      # 的資料。
      - name: Build trend file
        continue-on-error: true
        run: |
          node --experimental-strip-types scripts/dev/ga-build-trend.mjs \
            --history /tmp/gh-data/history \
            --out /tmp/gh-data/trends.json

      # issue #207：首屏 RegionSplitLedger 的趨勢三件組（WoW delta + 7d sparkline）需要一份 7d
      # bundle window 的 (obs,n) 序列——#184 決定 2/5 講得很明白：「28d 滾動視窗畫不出趨勢」，
      # 相鄰兩點共用 27/28 資料，SAB 修復在 7d 視窗 8 天到位、在 28d 視窗被抹成一道 28 天斜坡。
      # 上面那步产出的 `trends.json` 用預設 `--bundle-window 28d`（本期待辦固定吃 28d，#191 決定
      # 5），這裡另外跑一次同一支腳本、只換 `--bundle-window 7d` 與 `--out` 檔名，產出獨立的
      # `trends-7d.json`——兩份檔案互不覆蓋，`useGaTrends.ts` 的 `bundleWindow` 參數各自 fetch
      # 對應那一份。同樣 `continue-on-error: true`：衍生產物失敗不該擋下 snapshot.json/history/
      # 的 commit + push。
      - name: Build trend file (7d)
        continue-on-error: true
        run: |
          node --experimental-strip-types scripts/dev/ga-build-trend.mjs \
            --history /tmp/gh-data/history \
            --out /tmp/gh-data/trends-7d.json \
            --bundle-window 7d

      - name: Commit + push
        run: |
          cd /tmp/gh-data
          git config user.name "ga-snapshot-bot"
          git config user.email "ga-snapshot-bot@users.noreply.github.com"
          git add snapshot.json history/
          [ -f trends.json ] && git add trends.json
          [ -f trends-7d.json ] && git add trends-7d.json
          git diff --cached --quiet && exit 0
          git commit -m "data(snapshot): $(date -u +%Y-%m-%d)"
          git push -u origin gh-data
