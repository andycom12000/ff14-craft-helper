name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.tmp/**'
  pull_request:
    branches: [main]

# Cancel duplicate runs when a branch is pushed faster than CI finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      # vitest.config.ts deliberately excludes scripts/** (ETL/pipeline scripts,
      # run via node:test instead — see build-game-data.test.mjs's precedent).
      # Runs in this job (not a new one) so it rides the `test` required status
      # check instead of adding an unrequired job that would strand PRs waiting
      # on a check nobody configured as required.
      - run: npm run test:scripts

  build:
    runs-on: ubuntu-latest
    needs: [type-check]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # vue-tsc already validated by type-check job; just run vite build here.
      - run: npx vite build
